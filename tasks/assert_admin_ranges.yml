---
# Format check on nextcloud_allowed_admin_ranges. Whether a range is the RIGHT
# one can't be validated from here, but a malformed entry can - and that is the
# failure that silently matches nothing, hiding every admin action instead of
# restricting it, because Nextcloud stores whatever string it is given and
# compares against it.
#
# Its own file so both entry points share one copy of the regex: playbook.yml
# reaches it through preflight_install.yml, and restore.yml mirrors it in its
# own restore-specific preflight (it deliberately does not include
# preflight_install.yml). Without the second caller the check never ran on a
# restore at all, so a bad range would first bite during disaster recovery -
# precisely the moment configure_admin_ranges.yml's header warns about.
#
# Both callers tag it preflight, so it fails before anything is touched rather
# than after the data is back.

- name: Assert the admin IP ranges are CIDR notation
  vars:
    admin_range_re: '^((\d{1,3}\.){3}\d{1,3}/\d{1,2}|[0-9A-Fa-f:]*:[0-9A-Fa-f:]*/\d{1,3})$'
  ansible.builtin.assert:
    that:
      - nextcloud_allowed_admin_ranges | reject('match', admin_range_re) | list | length == 0
    fail_msg: >-
      nextcloud_allowed_admin_ranges must be a list of CIDR ranges
      (e.g. "203.0.113.4/32", "2001:db8::/48"). A bare IP address with no
      prefix length matches nothing, hiding every admin action instead of
      restricting it. Offending entries:
      {{ nextcloud_allowed_admin_ranges | reject('match', admin_range_re) | list | join(', ') }}
  when:
    - nextcloud_allowed_admin_ranges is defined
    - nextcloud_allowed_admin_ranges | length > 0
