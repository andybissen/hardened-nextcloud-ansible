# Apache 2.4.53+ defaults LimitRequestBody to 1GiB, which silently caps
# uploads at 1GB regardless of what upload_max_filesize/post_max_size say
# in php.ini - this is a well-documented, easy-to-miss gotcha specifically
# called out in Nextcloud's own big-file-upload documentation.
#
# The z- prefix (on this file and its rendered/mounted names - see
# render_config.yml and docker-compose.yml.j2) matches z-nextcloud-apache-
# hardening.conf's convention: Apache loads conf-enabled/*.conf
# alphabetically, and this guarantees ours loads last regardless of what
# else is in that directory. No directive here is actually known to
# conflict with a Debian stock default the way ServerTokens did, but it
# costs nothing to apply the same defensive ordering consistently rather
# than leave one custom conf file protected and the other not.
#
# Setting this to 0 (unlimited) means PHP's own settings become the only
# actual ceiling, rather than needing to keep two separate size limits
# (Apache's and PHP's) in sync with each other.
LimitRequestBody 0
