# Version fingerprinting and BREACH (CVE-2013-3587) mitigation for the
# Nextcloud Apache container. Kept separate from nextcloud-apache-limits.conf
# since that file is specifically about the LimitRequestBody upload gotcha,
# not general hardening.
#
# The z- prefix (on this file and its rendered/mounted names - see
# render_config.yml and docker-compose.yml.j2) is load-bearing, not
# cosmetic: Apache loads conf-enabled/*.conf files in alphabetical order,
# and Debian's stock apache2 package ships conf-enabled/security.conf with
# ServerTokens OS by default. Without sorting after it, security.conf would
# load second and silently override the ServerTokens/ServerSignature
# settings below back to its own defaults - which is exactly what happened
# before this file had the z- prefix.

# Reduces the Server: response header from "Apache/2.4.67 (Debian)" down to
# just "Apache" - Prod is the only ServerTokens level that drops the version
# and OS entirely rather than just trimming module details.
ServerTokens Prod

# Stops Apache's own auto-generated error pages / directory listings from
# appending a version+OS signature line at the bottom.
ServerSignature Off

# BREACH lets an attacker who can (a) get a request reflected into a
# response and (b) observe the compressed response SIZE gradually recover a
# secret (e.g. a CSRF token) that's also reflected in that same response, by
# noticing which guessed characters compress better - it only works at all
# if HTTP compression is in play. Nextcloud is a large, evolving app with
# many endpoints (login, sharing, OCS/API responses, etc.), and reliably
# enumerating every one that might ever reflect a secret isn't realistic -
# so rather than trying to exclude "just the risky paths", this disables
# gzip/deflate compression for every response. The cost is somewhat larger
# transfers for static JS/CSS/assets; the benefit is fully closing this
# vulnerability class rather than leaving gaps for endpoints missed today
# or added by a future Nextcloud/app update.
#
# Kept as a harmless defense-in-depth backstop against Apache's OWN
# mod_deflate (see z-deflate-disabled.conf, mounted over
# mods-enabled/deflate.conf, for why that's neutralized separately too).
# Confirmed via a debug header that this env var genuinely was being set
# correctly, yet mod_deflate compressed /login anyway: AddOutputFilterByType
# registers its filter internally under a "BYTYPE:"-prefixed name (a
# mod_filter implementation detail), a different codepath from the classic
# SetOutputFilter DEFLATE example Apache's own docs demonstrate no-gzip
# against - apparently why it wasn't being honored.
SetEnv no-gzip 1

# The actual source of /login's compression turned out to be neither of the
# above: Nextcloud's own lib/private/AppFramework/Middleware/
# CompressionMiddleware.php unconditionally gzencode()s any BaseResponse/
# JSONResponse/TemplateResponse (which covers most of the app, including
# login) whenever the response is HTTP 200 and the request's Accept-Encoding
# header contains "gzip" - entirely independent of Apache or php.ini, and
# with no config.php setting to control it. Since that's its only
# condition, stripping the request header before PHP ever sees it is
# enough to stop it - no need to patch Nextcloud's own code (which
# wouldn't survive an upgrade anyway).
RequestHeader unset Accept-Encoding
