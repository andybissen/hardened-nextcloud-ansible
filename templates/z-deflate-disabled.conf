# Deliberately empty - bind-mounted over the image's own
# /etc/apache2/mods-enabled/deflate.conf (which normally registers
# AddOutputFilterByType DEFLATE for text/html and several other types),
# replacing it with nothing so no compression filter is ever registered
# for any content type in the first place.
#
# Why this exists instead of just relying on SetEnv no-gzip (see
# z-nextcloud-apache-hardening.conf): that variable was confirmed (via a
# debug header) to be set correctly, but mod_deflate compressed anyway.
# AddOutputFilterByType's filter is registered internally under a
# "BYTYPE:"-prefixed name via mod_filter's dynamic provider mechanism, a
# different codepath from the classic SetOutputFilter DEFLATE usage that
# Apache's own docs demonstrate no-gzip against - apparently why it wasn't
# being honored. Preventing the registration entirely sidesteps that
# whole mechanism rather than depending on it working correctly.
